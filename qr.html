<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR codes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;padding:2rem 1rem;font:400 1rem/1.5 system-ui,sans-serif;background:#f4f0e9;color:#3b2f27}
main{max-width:56rem;margin:0 auto}
h1{font:500 2rem/1.1 Georgia,serif;margin:0 0 .5rem}
label{display:block;margin:1rem 0 .3rem;font-weight:600}
input{width:100%;padding:.6rem .8rem;border:1px solid #bdb2a3;border-radius:.5rem;font:inherit;background:#fff}
button{margin-top:.7rem;padding:.55rem 1.2rem;border:0;border-radius:999px;background:#3b2f27;color:#f4f0e9;font:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:1rem;margin-top:1.5rem}
.card{background:#fff;border-radius:.8rem;padding:.8rem;text-align:center;break-inside:avoid}
.qr{display:flex;justify-content:center}
.qr img,.qr canvas{max-width:100%;height:auto}
.card b{display:block;margin:.4rem 0 .1rem}
.card a{font-size:.85rem;color:#3b2f27}
@media print{body{background:#fff}.ui{display:none}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main>
  <div class="ui">
    <h1>Calendar QR codes</h1>
    <p>One code per day. Each opens that day's note on the calendar.</p>
    <label for="base">Calendar address</label>
    <input id="base" value="https://awbs.github.io/hazs-bday-calendar/">
    <button id="go">Make codes</button>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script>
const grid = document.getElementById("grid");
function build() {
  grid.textContent = "";
  const base = document.getElementById("base").value.trim().split("?")[0];
  for (let d = 1; d <= 16; d++) {
    const url = base + "?day=" + d;
    const card = document.createElement("div"); card.className = "card";
    const box = document.createElement("div"); box.className = "qr";
    card.appendChild(box);
    new QRCode(box, { text: url, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
    const lab = document.createElement("b"); lab.textContent = "Day " + d;
    const dl = document.createElement("a"); dl.textContent = "Save PNG"; dl.className = "ui";
    card.append(lab, dl);
    grid.appendChild(card);
    setTimeout(() => {
      const c = box.querySelector("canvas");
      if (c) { dl.href = c.toDataURL("image/png"); dl.download = "day-" + d + ".png"; }
    }, 50);
  }
}
document.getElementById("go").addEventListener("click", build);
build();
</script>
</body>
</html>
