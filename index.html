<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birthday calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e3e9dc;--ink:#2e3b2f;--muted:#5a6a5b;--accent:#e4b9a6;--paper:#f6f8f1;--deep:#4f6b52;
  --d1:#a9bb9c;--d2:#93a88a;--d3:#bfcbb0;--d4:#9db3a4}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:400 1rem/1.5 Figtree,system-ui,sans-serif;background:var(--bg);padding:2.5rem 1rem 3rem}
main{max-width:46rem;margin:0 auto}
h1{font:400 clamp(2.4rem,9vw,4rem)/1.05 Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0 0 .5rem}
.sub{color:var(--muted);margin:0 0 2rem;max-width:34rem}
.banner{background:var(--accent);color:var(--ink);padding:.5rem .8rem;border-radius:.5rem;margin:0 0 1.5rem;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;list-style:none;margin:0;padding:0}
@media(min-width:620px){.grid{grid-template-columns:repeat(8,1fr);gap:.9rem}}
.door{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;width:100%;aspect-ratio:3/4;
  border-radius:2rem 2rem .4rem .4rem;font:400 clamp(1.5rem,6vw,2.1rem)/1 Fraunces,Georgia,serif;
  background:var(--d1);color:var(--ink);box-shadow:inset 0 0 0 2px rgba(46,59,47,.12);position:relative;transition:transform .15s}
.grid li:nth-child(4n+2) .door{background:var(--d2)}
.grid li:nth-child(4n+3) .door{background:var(--d3)}
.grid li:nth-child(4n+4) .door{background:var(--d4)}
.door::after{content:"";position:absolute;right:.6rem;top:55%;width:.4rem;height:.4rem;border-radius:50%;background:var(--ink);opacity:.45}
.door:hover{transform:translateY(-3px)}
.door:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.door.open{background:var(--accent)}
.door.open::after{display:none}
.door.locked{opacity:.6}
.door.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hint{min-height:1.5rem;color:var(--muted);margin:1rem 0 0}
dialog{border:0;border-radius:1.2rem;padding:0;max-width:min(32rem,92vw);width:100%;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(46,59,47,.55)}
.sheet{padding:1.4rem}
.sheet h2{font:400 1.8rem/1.15 Fraunces,Georgia,serif;margin:0 0 .6rem;color:var(--deep)}
.sheet p{margin:0 0 1rem;white-space:pre-line}
.sheet audio,.sheet video{width:100%;border-radius:.5rem;background:#000}
.sheet iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:.5rem}
.close{all:unset;cursor:pointer;margin-top:1rem;padding:.5rem 1.1rem;border-radius:999px;background:var(--d2);font-weight:600}
.close:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Birthday calendar</h1>
  <p class="sub">One door opens each day from 1 to 16 November. Tap today's door to play it.</p>
  <div id="banner"></div>
  <ul class="grid" id="grid"></ul>
  <p class="hint" id="hint" role="status"></p>
</main>

<dialog id="dlg" aria-labelledby="dt">
  <div class="sheet">
    <h2 id="dt"></h2>
    <p id="dx"></p>
    <div id="dm"></div>
    <button class="close" id="close">Close</button>
  </div>
</dialog>

<script>
/* ---------- EDIT THIS SECTION ---------- */
const YEAR = 2026;

/* One entry per day (1-16). media.type can be:
   "audio"   -> src: "notes/day1.mp3"     (file in your repo)
   "video"   -> src: "notes/day2.mp4"     (file in your repo)
   "youtube" -> id:  "dQw4w9WgXcQ"        (unlisted video ID)
   "embed"   -> src: "https://w.soundcloud.com/player/?url=..."  (any embed URL)
   Leave media out for a text-only door. Days without an entry show a placeholder. */
const DAYS = {
  1: { title: "Demo door", text: "If you can hear a little chime, audio is working. Swap this for your own note.", media: { type: "audio", src: "notes/demo.wav" } },
  2: { title: "Day 2", text: "A text-only door." },
  16:{ title: "Day 16", text: "Happy birthday!" }
};
/* --------------------------------------- */

const preview = new URLSearchParams(location.search).has("preview");
const KEY = "advent-opened-" + YEAR;
let opened = [];
try { opened = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(opened)); } catch (e) {} };

const grid = document.getElementById("grid");
const hint = document.getElementById("hint");
const dlg = document.getElementById("dlg");
const isUnlocked = d => preview || new Date() >= new Date(YEAR, 10, d);

if (preview) {
  document.getElementById("banner").innerHTML = '<p class="banner">Preview mode: every door is unlocked.</p>';
}

for (let d = 1; d <= 16; d++) {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.className = "door";
  b.textContent = d;
  const unlocked = isUnlocked(d);
  if (!unlocked) b.classList.add("locked");
  if (opened.includes(d)) b.classList.add("open");
  b.setAttribute("aria-label", "Door " + d + (unlocked ? "" : ", locked until November " + d));
  b.addEventListener("click", () => {
    if (!unlocked) {
      hint.textContent = "Door " + d + " opens on " + d + " November.";
      b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      return;
    }
    hint.textContent = "";
    if (!opened.includes(d)) { opened.push(d); save(); }
    b.classList.add("open");
    show(d);
  });
  li.appendChild(b);
  grid.appendChild(li);
}

function show(d) {
  const e = DAYS[d] || { title: "Day " + d, text: "Nothing here yet." };
  document.getElementById("dt").textContent = e.title || "Day " + d;
  document.getElementById("dx").textContent = e.text || "";
  const box = document.getElementById("dm");
  box.textContent = "";
  const m = e.media;
  if (m) {
    let el;
    if (m.type === "audio" || m.type === "video") {
      el = document.createElement(m.type);
      el.controls = true; el.preload = "metadata"; el.src = m.src;
      if (m.type === "video") el.playsInline = true;
    } else if (m.type === "youtube" || m.type === "embed") {
      el = document.createElement("iframe");
      el.src = m.type === "youtube" ? "https://www.youtube.com/embed/" + encodeURIComponent(m.id) : m.src;
      el.allow = "autoplay; encrypted-media; fullscreen";
      el.title = e.title || "Media";
    }
    if (el) box.appendChild(el);
  }
  dlg.showModal();
}

function stop() { document.getElementById("dm").textContent = ""; }
document.getElementById("close").addEventListener("click", () => dlg.close());
dlg.addEventListener("close", stop);
dlg.addEventListener("click", ev => { if (ev.target === dlg) dlg.close(); });
</script>
</body>
</html>
